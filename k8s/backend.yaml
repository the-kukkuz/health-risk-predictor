apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: health-risk
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Build image from backend/Dockerfile and push to your registry.
          image: health-risk/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: health-risk-config
            - secretRef:
                name: health-risk-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://riskapp:$(POSTGRES_PASSWORD)@postgres:5432/healthrisk"
          # Model artifact + data must be present at these paths. Bake them
          # into the image or mount a shared volume / object store.
          # volumeMounts:
          #   - name: models
          #     mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1500Mi"
      # volumes:
      #   - name: models
      #     persistentVolumeClaim:
      #       claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: health-risk
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
