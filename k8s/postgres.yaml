apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: health-risk
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: health-risk-config
            - secretRef:
                name: health-risk-secrets
          env:
            - name: POSTGRES_USER
              value: "riskapp"
            - name: POSTGRES_DB
              value: "healthrisk"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-risk-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "riskapp", "-d", "healthrisk"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "riskapp", "-d", "healthrisk"]
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: health-risk
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: health-risk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
