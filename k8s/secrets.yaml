apiVersion: v1
kind: Secret
metadata:
  name: health-risk-secrets
  namespace: health-risk
type: Opaque
# NOTE: these are base64-encoded example values. For a real cluster, replace
# them using a secret manager or `kubectl create secret generic`.
# echo -n 'riskapp' | base64 -> cmlza2FwcA==
# echo -n 'change-me-in-production' | base64 -> Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
