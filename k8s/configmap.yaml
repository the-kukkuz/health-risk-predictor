apiVersion: v1
kind: ConfigMap
metadata:
  name: health-risk-config
  namespace: health-risk
data:
  ENVIRONMENT: "production"
  # Comma-separated allowed origins. Adjust to your real frontend origin(s).
  CORS_ORIGINS: "http://localhost:8080"
  MODEL_DIR: "/models/diabetes"
  DATA_DIR: "/data/diabetes"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "healthrisk"
  POSTGRES_USER: "riskapp"
