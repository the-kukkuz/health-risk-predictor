services:
  postgres:
    image: postgres:16-alpine
    container_name: hrp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskapp}
      POSTGRES_DB: ${POSTGRES_DB:-healthrisk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskapp} -d ${POSTGRES_DB:-healthrisk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hrp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-riskapp}:${POSTGRES_PASSWORD:-riskapp}@postgres:5432/${POSTGRES_DB:-healthrisk}
      # MODEL_DIR and DATA_DIR are intentionally omitted here; they are set in
      # the Dockerfile and the image is self-contained (models/data are baked in).
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    # No host volume mounts for models/data/ml: the production image is
    # self-contained. For local development without a rebuild, you can
    # temporarily restore these mounts:
    #   - ./models:/models:ro
    #   - ./data:/data:ro
    #   - ./ml:/ml:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: hrp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
